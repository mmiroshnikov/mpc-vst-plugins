# One-shot: publish Maschine Group 1.0.0 as a stable (non-latest) GitHub release so the
# catalog can list it. Does not become the repo's "Latest" (that stays the desktop installer).
# Re-runs are a no-op once maschine-group-v1.0.0 is published.
name: Publish Maschine Group
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/maschine-group-release.yml']
permissions:
  contents: write
concurrency:
  group: maschine-group-release
  cancel-in-progress: false
env:
  TAG: maschine-group-v1.0.0
  VERSION: 1.0.0
  VST_DIR: ports/maschine/vst
jobs:
  release:
    if: ${{ github.repository == 'sd88me/mpc-vst-plugins' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip if already published
        id: gate
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                    --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          echo "existing=$state"
          if [ "$state" = published ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.skip != '1' }}

      - uses: docker/setup-qemu-action@v3
        if: ${{ steps.gate.outputs.skip != '1' }}
        with:
          platforms: arm

      - name: Install Pillow
        if: ${{ steps.gate.outputs.skip != '1' }}
        run: python3 -m pip install --quiet pillow

      - name: Build and host-test
        if: ${{ steps.gate.outputs.skip != '1' }}
        run: ports/maschine/build.sh

      - name: Package
        if: ${{ steps.gate.outputs.skip != '1' }}
        id: pkg
        run: |
          B="$VST_DIR/build"
          entry="$B/pluginlist-entry.xml"
          so="$B/$(sed -n 's/.* file="[^"]*\/\([^"/]*\)".*/\1/p' "$entry")"
          skins=("$B"/skin/*/)
          [ ${#skins[@]} = 1 ] || { echo "::error::expected one skin folder"; exit 1; }
          skin="${skins[0]%/}"
          file -b "$so" | grep -q 'ELF 32-bit LSB.*ARM' || { echo "::error::$so is not ARM ELF"; exit 1; }
          python3 tools/release.py \
            --so "$so" --skin "$skin" --entry "$entry" --version "$VERSION" \
            --about "Opens a Native Instruments Maschine 2 drum group (.mxgrp) and plays its pads and stored patterns." \
            --repo "$GITHUB_REPOSITORY" --license MIT --id maschine-group \
            --user-data groups -o dist
          zip=$(ls dist/*.zip)
          python3 tools/catalog_check.py "$zip" --catalog --expect-id maschine-group --expect-repo "$GITHUB_REPOSITORY"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish stable release
        if: ${{ steps.gate.outputs.skip != '1' }}
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - "$ZIP" > notes.md <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          md = z.read(next(n for n in z.namelist() if n.endswith("/INSTALL.md"))).decode()
          keep = [s for s in re.split(r"(?m)^(?=## )", md) if s.startswith(("## Requirements", "## Install (scripted)"))]
          print("Opens a Native Instruments Maschine 2 drum group (.mxgrp) and plays its pads and stored patterns.\n")
          print("".join(keep).rstrip() + "\n")
          print("Full instructions, including installing by hand, are in `INSTALL.md` inside the zip.")
          PY
          gh release create "$TAG" "$ZIP" \
            --title "Maschine Group 1.0.0" \
            --notes-file notes.md \
            --latest=false \
            --target "$GITHUB_SHA"
